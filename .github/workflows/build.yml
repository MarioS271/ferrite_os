name: Build

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # required for softprops/action-gh-release on tagged pushes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xorriso mtools

      # Limine v8.x-binary is a moving branch; re-use the last clone until the
      # cache key is manually busted or the workflow file changes.
      - name: Cache Limine
        id: cache-limine
        uses: actions/cache@v4
        with:
          path: limine
          key: limine-v8.x-binary-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Clone and build Limine
        if: steps.cache-limine.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/limine-bootloader/limine.git \
            --branch=v8.x-binary --depth=1 limine
          make -C limine

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-unknown-none
          components: rust-src

      # Caches ~/.cargo/registry, ~/.cargo/git, and ./target.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build kernel
        run: cargo build --target x86_64-unknown-none --manifest-path src/kernel/Cargo.toml

      - name: Assemble ISO
        run: |
          mkdir -p build/iso/boot/limine build/iso/EFI/BOOT

          cp target/x86_64-unknown-none/debug/kernel build/iso/kernel
          sed 's/\r//' run/configs/limine.conf > build/iso/boot/limine/limine.conf

          cp limine/BOOTX64.EFI        build/iso/EFI/BOOT/
          cp limine/BOOTIA32.EFI       build/iso/EFI/BOOT/
          cp limine/limine-uefi-cd.bin build/iso/boot/limine/

          xorriso -as mkisofs \
            -no-emul-boot \
            --efi-boot boot/limine/limine-uefi-cd.bin \
            -efi-boot-part --efi-boot-image \
            --protective-msdos-label \
            build/iso \
            -o build/ferrite_os.iso

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferrite_os-iso
          path: build/ferrite_os.iso

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ferrite_os.iso

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: ferrite_os-iso
          path: build

      # Assemble the Pages site. Layout:
      #   pages/
      #     index.html, ferrite-x86_64.html, ferrite-x86_64-module.js  (from web/)
      #     coi-serviceworker.js                                        (vendored from ktock)
      #     ferrite_os.iso                                              (this build)
      #     assets/
      #       out.js, qemu-system-x86_64.wasm, qemu-system-x86_64.worker.js
      #         (prebuilt ktock/qemu-wasm-demo binaries, fetched at CI time)
      #       OVMF_CODE.fd
      #         (EDK2 nightly x86_64 OVMF firmware, fetched at CI time)
      - name: Stage Pages content
        run: |
          set -euo pipefail
          mkdir -p pages/assets
          cp web/index.html web/ferrite-x86_64.html web/ferrite-x86_64-module.js pages/
          cp build/ferrite_os.iso pages/

          KTOCK_BASE='https://ktock.github.io/qemu-wasm-demo/images/alpine-x86_64'
          curl -fsSL "$KTOCK_BASE/out.js"                          -o pages/assets/out.js
          curl -fsSL "$KTOCK_BASE/qemu-system-x86_64.wasm"         -o pages/assets/qemu-system-x86_64.wasm
          curl -fsSL "$KTOCK_BASE/qemu-system-x86_64.worker.js"    -o pages/assets/qemu-system-x86_64.worker.js

          curl -fsSL 'https://ktock.github.io/qemu-wasm-demo/coi-serviceworker.js' \
            -o pages/coi-serviceworker.js

          curl -fsSL 'https://retrage.github.io/edk2-nightly/bin/RELEASEX64_OVMF.fd' \
            -o pages/assets/OVMF_CODE.fd

          # ktock's out.js was generated alongside an absolute locateFile
          # pointing at /qemu-wasm-demo/images/alpine-x86_64/. Our Module.locateFile
          # overrides this at runtime, but Emscripten's bootstrap reads
          # mainScriptUrlOrBlob from the script tag. Nothing to patch here -
          # our Module.locateFile + Module.mainScriptUrlOrBlob in
          # ferrite-x86_64-module.js take precedence.
          ls -lh pages pages/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
